# The question set the survey asks answer engines. Each question belongs to a
# topic cluster. `demand` is a relative weight (1-5) for how often developers
# ask this kind of thing; replace the seed values with search volume, support
# tickets, or agent-traffic counts once you have them. `format` is the content
# type that would answer it best if Render has a gap here.

