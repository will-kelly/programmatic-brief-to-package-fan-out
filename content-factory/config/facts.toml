# The fact registry: short, checkable statements about Render that content
# and LLM answers get measured against.
#
# Every fact names the docs section it depends on (`source`, a section ID in
# the docs snapshot). That link does two jobs. The fact-checker uses the
# section text as evidence, and the refresh job flags the fact, and every
# published claim that cites it, when that section changes.
#
# `status`:
#   seed      written by hand, not yet matched to a live docs section. The
#             checker treats a claim backed only by a seed fact as
#             CORROBORATED, never VERIFIED.
#   verified  a human matched it to the live docs on `verified_on`.
#
# The seed values below were written without access to the live docs. Run
# `cf facts verify` against a real snapshot before trusting any of them.

[[fact]]
id = "F-free-spindown"
topic = "free-tier"
statement = "Free web services spin down after 15 minutes without inbound traffic, and the next request waits while the service spins back up."
source = "free#spin-down"
status = "seed"
wrong_patterns = ["free (tier|plan|instances?) (never|doesn't|does not) (sleep|spin down)", "spin(s)? down after (5|10|30|60) minutes"]

[[fact]]
id = "F-free-no-workers"
topic = "free-tier"
statement = "Background workers and cron jobs aren't available on the free instance type."
source = "free#unsupported"
status = "seed"
wrong_patterns = ["free (tier|plan|instance type)[^.]{0,30}\\b(includes|supports|offers|with|runs?) (background )?workers", "workers? (on|in) the free (tier|plan|instance type)", "free cron jobs?"]

[[fact]]
id = "F-free-no-disk"
topic = "free-tier"
statement = "Free instances can't attach a persistent disk, so files written at runtime are lost on redeploy or spin-down."
source = "free#filesystem"
status = "seed"
wrong_patterns = ["free (tier|plan|instances?) (include|includes|support|supports) (a )?persistent disk"]

[[fact]]
id = "F-free-postgres-expiry"
topic = "free-tier"
statement = "Free Render Postgres databases expire 30 days after creation unless upgraded."
source = "free#postgres"
status = "seed"
wrong_patterns = ["free postgres (never expires|is permanent|has no expiration)", "expires? after 90 days"]

[[fact]]
id = "F-port-default"
topic = "web-services"
statement = "A web service must bind to 0.0.0.0 on the port in the PORT environment variable, which defaults to 10000."
source = "web-services#port-binding"
status = "seed"
wrong_patterns = ["(default|defaults to) port (80|3000|5000|8000|8080)\\b on render", "render (sets|uses) port (80|3000|5000|8080) by default"]

[[fact]]
id = "F-service-types"
